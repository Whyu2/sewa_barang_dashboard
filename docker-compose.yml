version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      # Jangan pakai 8000 di VPS ini — sudah dipakai Coolify (login page).
      # Pakai 8080 agar bisa diakses via http://45.66.153.148:8080/
      # Bisa dioverride via env: APP_PORT=8081 docker compose up -d
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf
      - storage_data:/var/www/html/storage
    depends_on:
      - db

  db:
    image: postgres:16-alpine # Atau mysql:8.0 jika di lokal kamu pakai MySQL
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sewa_barang}
      POSTGRES_USER: ${DB_USERNAME:-sewa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_rahasia_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Jangan expose 5432 ke host di VPS kalau tidak perlu (bentrok / risiko keamanan).
      # Hanya expose kalau butuh debug: DB_PORT=5433 docker compose up -d
      - "127.0.0.1:${DB_PORT:-5433}:5432"

volumes:
  db_data:
  storage_data:
